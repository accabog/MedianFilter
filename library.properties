name=MedianFilter
version=1.0.0
author=Alexandru Bogdan
maintainer=Alexandru Bogdan
sentence=Heap-free sliding-window median filter for embedded C/C++.
paragraph=Removes spike and impulse noise from analog signals with no dynamic memory allocation. Searches from the median pointer: fewer than n/2 list steps per sample, about n/4 on noise-like input, none for new extremes or constant input. Works with the C API (MedianFilter.h/.c) or the header-only C++ template (MedianFilter.hpp). No heap, no dependencies, suitable for bare-metal and RTOS targets.
category=Signal Input/Output
url=https://github.com/accabog/MedianFilter
architectures=*
includes=MedianFilter.h,MedianFilter.hpp
license=MIT
